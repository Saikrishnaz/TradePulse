# TradePulse behind nginx. Serving it on the OMS's own host name under /pulse/ is NOT supported
# (the SPA uses absolute /api paths) - use its own subdomain. To get single sign-on with the OMS
# dashboard, share the parent domain cookie or simply sign in once with the same OMS credentials.
server {
    listen 443 ssl http2;
    server_name pulse.skymatrixpartners.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    client_max_body_size 128k;

    # Server-Sent Events: no buffering, long read timeout.
    location = /api/events/stream {
        proxy_pass http://127.0.0.1:8895;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8895;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
